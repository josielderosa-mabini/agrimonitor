<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriMonitor | Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #EDF6F9;
      padding: 20px;
    }

    .register-box {
      background: #FFFFFF;
      width: 100%;
      max-width: 400px;
      padding: 35px;
      border-radius: 15px;
      border: 1px solid #B8DDDC;
      box-shadow: 0 8px 25px rgba(0, 120, 114, 0.12);
    }

    h1 {
      color: #007872;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #647B7A;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #23352C;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #B8DDDC;
      border-radius: 7px;
      background: #F8FCFD;
      color: #23352C;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #8A9D9B;
    }

    input:focus {
      border-color: #419E98;
      box-shadow: 0 0 0 3px rgba(130, 196, 190, 0.25);
      background: #FFFFFF;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 22px;
      background: linear-gradient(135deg, #419E98, #007872);
      color: #FFFFFF;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: linear-gradient(135deg, #007872, #006560);
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #647B7A;
    }

    a {
      color: #007872;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      color: #419E98;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="register-box">
    <h1>AgriMonitor</h1>
    <p class="subtitle">Create your account</p>

    <form id="registerForm">
      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        maxlength="80"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="At least 6 characters"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter your password again"
        minlength="6"
        required
      >

      <button type="submit" id="registerButton">
        Create Account
      </button>

      <p id="message" role="status"></p>
    </form>

    <div class="links">
      Already have an account?
      <a href="login.html">Log in</a>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import {
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    const form = document.getElementById("registerForm");
    const fullNameInput = document.getElementById("fullName");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const fullName = fullNameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      message.style.color = "#c62828";

      if (!fullName) {
        message.textContent = "Please enter your full name.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";
      message.textContent = "";

      try {
        const userCredential = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        await updateProfile(userCredential.user, {
          displayName: fullName
        });

        message.style.color = "#007872";
        message.textContent =
          "Account created successfully! Redirecting...";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);

      } catch (error) {
        if (error.code === "auth/email-already-in-use") {
          message.textContent = "This email is already registered.";
        } else if (error.code === "auth/invalid-email") {
          message.textContent = "Please enter a valid email address.";
        } else if (error.code === "auth/weak-password") {
          message.textContent = "Please use a stronger password.";
        } else {
          message.textContent =
            "Registration failed: " + error.message;
        }
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
